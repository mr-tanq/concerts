name: Test TicketSwap

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check TicketSwap event and available listings
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
        run: node scripts/test-ticketswap.mjs
