name: Build Listening Mirror Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Restore Android companion project
        shell: bash
        run: |
          cat > /tmp/listening-mirror-android.tar.gz.b64 <<'PAYLOAD'
          
          PAYLOAD
          base64 --decode /tmp/listening-mirror-android.tar.gz.b64 > /tmp/listening-mirror-android.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/source"
          tar -xzf /tmp/listening-mirror-android.tar.gz -C "$GITHUB_WORKSPACE/source"
          test -f "$GITHUB_WORKSPACE/source/android-companion/settings.gradle.kts"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        working-directory: source/android-companion
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: source/android-companion
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: listening-mirror-debug-apk
          path: source/android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
