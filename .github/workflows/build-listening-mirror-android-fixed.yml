name: Build Listening Mirror Android APK - Fixed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Android companion project
        shell: bash
        run: |
          set -euo pipefail

          OLD_WORKFLOW=".github/workflows/build-listening-mirror-android.yml"

          if [ ! -f "$OLD_WORKFLOW" ]; then
            echo "Original workflow not found: $OLD_WORKFLOW"
            exit 1
          fi

          # Extract the embedded base64 payload from the original workflow.
          sed -n "/<<'PAYLOAD'/,/^[[:space:]]*PAYLOAD[[:space:]]*$/p" "$OLD_WORKFLOW" \
            | sed '1d;$d;s/^[[:space:]]*//' \
            > /tmp/listening-mirror-android.tar.gz.b64

          if [ ! -s /tmp/listening-mirror-android.tar.gz.b64 ]; then
            echo "Failed to extract embedded Android project payload."
            exit 1
          fi

          base64 --decode \
            /tmp/listening-mirror-android.tar.gz.b64 \
            > /tmp/listening-mirror-android.tar.gz

          mkdir -p "$GITHUB_WORKSPACE/source"

          tar -xzf \
            /tmp/listening-mirror-android.tar.gz \
            -C "$GITHUB_WORKSPACE/source"

          test -f \
            "$GITHUB_WORKSPACE/source/android-companion/settings.gradle.kts"

          MANIFEST="$GITHUB_WORKSPACE/source/android-companion/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST"

          # Fix invalid XML comment.
          # XML comments are not allowed to contain "--".
          sed -i \
            's/class -- the system binds it/class; the system binds it/g' \
            "$MANIFEST"

          echo "Android project restored successfully."
          echo "Manifest XML comment patched successfully."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        working-directory: source/android-companion
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: source/android-companion
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: listening-mirror-debug-apk
          path: source/android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
