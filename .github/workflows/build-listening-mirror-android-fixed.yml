name: Build Listening Mirror Android APK - Canonical

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore canonical Android companion source
        shell: bash
        run: |
          set -euo pipefail

          ARCHIVE="$GITHUB_WORKSPACE/listening-mirror-android-companion.tar.gz"
          SOURCE_DIR="$GITHUB_WORKSPACE/source"

          if [ ! -f "$ARCHIVE" ]; then
            echo "Canonical Android archive not found:"
            echo "$ARCHIVE"
            exit 1
          fi

          echo "Using canonical Android source:"
          ls -lh "$ARCHIVE"

          rm -rf "$SOURCE_DIR"
          mkdir -p "$SOURCE_DIR"

          tar -xzf "$ARCHIVE" -C "$SOURCE_DIR"

          PROJECT="$SOURCE_DIR/android-companion"

          if [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "Android project was not restored correctly."
            exit 1
          fi

          if [ ! -f "$PROJECT/gradlew" ]; then
            echo "Gradle wrapper is missing."
            exit 1
          fi

          chmod +x "$PROJECT/gradlew"

          echo
          echo "Canonical Android project restored successfully."
          echo "Project root:"
          echo "$PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        working-directory: source/android-companion
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: source/android-companion
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$GITHUB_WORKSPACE/source/android-companion/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not produced."
            exit 1
          fi

          echo
          echo "========================================"
          echo "LISTENING MIRROR APK BUILT SUCCESSFULLY"
          echo "========================================"
          echo
          ls -lh "$APK"

          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: listening-mirror-debug-apk
          path: source/android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
