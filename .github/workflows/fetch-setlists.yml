name: Fetch setlists

on:
  push:
    paths:
      - data/archive.json
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      max_lookups:
        description: "How many artist setlists to check this run"
        required: false
        default: "40"
        type: string

permissions:
  contents: write

concurrency:
  group: fetch-setlists
  cancel-in-progress: false

jobs:
  setlists:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate setlist matching
        run: node --test scripts/setlist-resolver.test.mjs

      - name: Fetch setlists
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
          MAX_LOOKUPS: ${{ inputs.max_lookups || '40' }}
        run: node scripts/fetch-setlists.mjs

      - name: Commit setlists
        run: |
          git config user.name "listening-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/setlists.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh setlists"
          git pull --rebase origin main
          git push origin HEAD:main
