name: Build Android companion APK

# The Android companion (media relay + ambient recognition) that feeds
# Mirror. Source lives in android-companion/ — runs on any change there,
# or by hand from the Actions tab.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-companion/**"
      - ".github/workflows/build-android-companion.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-companion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Show APK checksum
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: listening-mirror-companion-debug-apk
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
