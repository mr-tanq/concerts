name: Refresh TicketSwap for Going

on:
  push:
    branches: [main]
    paths:
      - data/ticketswap-requests.json
  workflow_dispatch:
    inputs:
      live:
        description: 'Call Parse API — uses credits, maximum 3 concerts'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ticketswap-going
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate scripts
        run: |
          node --check scripts/lib/ticketswap-going.mjs
          node --test scripts/ticketswap-matching.test.mjs
          node --check scripts/refresh-ticketswap.mjs

      - name: Preview without API calls
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.live }}
        run: node scripts/refresh-ticketswap.mjs

      - name: Load latest main for the serialized worker
        if: ${{ github.event_name == 'push' || inputs.live }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main

      - name: Check TicketSwap
        if: ${{ github.event_name == 'push' || inputs.live }}
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
          TICKETSWAP_INITIAL_CREDITS: ${{ vars.TICKETSWAP_INITIAL_CREDITS }}
          TICKETSWAP_DAILY_LIMIT: ${{ vars.TICKETSWAP_DAILY_LIMIT }}
          TICKETSWAP_MONTHLY_LIMIT: ${{ vars.TICKETSWAP_MONTHLY_LIMIT }}
          TICKETSWAP_CREDIT_RESERVE: ${{ vars.TICKETSWAP_CREDIT_RESERVE }}
          TICKETSWAP_TRUST_CREDIT_HEADERS: ${{ vars.TICKETSWAP_TRUST_CREDIT_HEADERS }}
          TICKETSWAP_REQUESTS: ${{ github.event_name == 'push' }}
        run: node scripts/refresh-ticketswap.mjs --live

      - name: Evaluate watches from saved observations
        if: ${{ github.event_name == 'push' || inputs.live }}
        continue-on-error: true
        env:
          TICKETSWAP_WATCH_ENABLED: ${{ vars.TICKETSWAP_WATCH_ENABLED }}
          TICKETSWAP_WATCH_CONTRACTS_VERIFIED: ${{ vars.TICKETSWAP_WATCH_CONTRACTS_VERIFIED }}
          TICKETSWAP_INITIAL_CREDITS: ${{ vars.TICKETSWAP_INITIAL_CREDITS }}
          TICKETSWAP_DAILY_LIMIT: ${{ vars.TICKETSWAP_DAILY_LIMIT }}
          TICKETSWAP_MONTHLY_LIMIT: ${{ vars.TICKETSWAP_MONTHLY_LIMIT }}
          TICKETSWAP_CREDIT_RESERVE: ${{ vars.TICKETSWAP_CREDIT_RESERVE }}
        run: node scripts/run-ticket-watches.mjs --publish-preview

      - name: Save availability
        if: ${{ github.event_name == 'push' || inputs.live }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ticketswap.json data/ticket-watch-state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh TicketSwap availability'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
