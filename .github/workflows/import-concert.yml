name: Import concert to archive

on:
  workflow_dispatch:
    inputs:
      planned_id:
        description: "id of the planned concert (from data/planned.json)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/import-to-archive.mjs "${{ inputs.planned_id }}"
      - name: Commit archive update
        run: |
          git config user.name "listening-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/archive.json data/planned.json
          git commit -m "chore: import concert ${{ inputs.planned_id }} into archive"
          git push
