name: Enrich artist images

# Looks up a photo for every artist in the archive / planned / dismissed /
# recommendations, and writes data/artist-images.json.
#
# Runs here rather than in the browser because Deezer blocks CORS — the app
# only ever reads the resulting static file. No API key is needed.
#
# Safe to re-run: artists already resolved are skipped, and misses are
# retried only after the refresh window in the script.

on:
  push:
    branches: [main]
    paths:
      - scripts/enrich-artist-images.mjs
      - scripts/lib/artist-image-model.mjs
      - scripts/artist-image-model.test.mjs
      - .github/workflows/enrich-artist-images.yml
      - data/planned.json
  schedule:
    - cron: "30 5 * * *"   # daily — discovery now finds new artists more than once a week
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: artist-images
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node --test scripts/artist-image-model.test.mjs
      - run: node scripts/enrich-artist-images.mjs

      - name: Commit artist images
        run: |
          git config user.name "listening-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/artist-images.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh artist images"
          git pull --rebase origin main
          git push
