name: Refresh official ticket offers

on:
  push:
    branches: [main]
    paths: [data/official-ticket-requests.json]
  workflow_dispatch:
    inputs:
      concert_id:
        description: Planned concert ID
        type: string
        required: true
      live:
        description: Fetch public official pages and save verified results
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: official-ticket-offers
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: git pull --ff-only origin main
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preview supported sources
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.live }}
        env:
          CONCERT_ID: ${{ inputs.concert_id }}
        run: node scripts/refresh-official-tickets.mjs "$CONCERT_ID"
      - name: Verify public official ticket data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
        env:
          CONCERT_ID: ${{ inputs.concert_id }}
        run: node scripts/refresh-official-tickets.mjs "$CONCERT_ID" --live
      - name: Process requested official checks
        if: github.event_name == 'push'
        run: node scripts/refresh-official-tickets.mjs --requests
      - name: Save official ticket snapshot
        if: ${{ github.event_name == 'push' || inputs.live }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/official-ticket-offers.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified official ticket data'
          git pull --rebase origin main
          git push origin HEAD:main
