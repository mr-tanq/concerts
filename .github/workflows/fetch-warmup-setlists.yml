name: Fetch requested warm-up setlists
on:
  push:
    branches: [main]
    paths:
      - data/warmup-setlist-requests.json
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: warmup-setlists
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/warmup-setlists.test.mjs scripts/warmup-demand.test.mjs
      - name: Fetch only requested setlists
        env:
          SETLISTFM_API_KEY: ${{ secrets.SETLISTFM_API_KEY }}
        run: node scripts/fetch-warmup-setlists.mjs
      - name: Save requested setlists
        run: |
          git config user.name "listening-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/warmup-setlists.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: save requested warm-up setlists"
          git pull --rebase origin main
          git push origin HEAD:main
