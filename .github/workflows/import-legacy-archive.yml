name: Import legacy archive

# One-off recovery: reads data/legacy-worker-bundle.js (the compiled
# Cloudflare Worker that held the original seed) and rewrites
# data/archive.json in the current schema.
#
# Safe to re-run — the importer rebuilds archive.json from the bundle each
# time and dedupes, so it can't accumulate duplicates.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/import-legacy-archive.mjs

      - name: Commit recovered archive
        run: |
          git config user.name "listening-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/archive.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: recover archive from legacy worker seed"
          git push