name: Discover concerts

on:
  schedule:
    - cron: "0 6,18 * * *"   # twice a day — adjust as you like
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run discovery script
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
        run: node scripts/discover-concerts.mjs

      - name: Commit updated recommendations + caches
        run: |
          git config user.name "listening-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/recommendations.json data/podiuminfo-day-cache.json data/podiuminfo-cache.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh recommendations"
          git push