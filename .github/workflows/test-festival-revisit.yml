name: Test Festival Discovery 2.0

on:
  pull_request:
    branches: [main]
    paths:
      - 'js/app.js'
      - 'js/festival-revisit-model.js'
      - 'scripts/discover-concerts.mjs'
      - 'scripts/sources/festivalinfo.mjs'
      - 'scripts/festival-*.test.mjs'
      - '.github/workflows/discover-concerts.yml'
      - '.github/workflows/test-festival-revisit.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  festival-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run festival matching and revisit regression tests
        run: node --test scripts/festival-discovery.test.mjs scripts/festival-images.test.mjs scripts/festival-revisit.test.mjs scripts/going-season.test.mjs
