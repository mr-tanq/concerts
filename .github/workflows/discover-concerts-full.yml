name: Discover concerts (full tier, weekly)

on:
  schedule:
    - cron: "0 5 * * 1"   # every Monday at 05:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  discover-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run discovery script (full tier)
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_USER: ${{ secrets.LASTFM_USER }}
          DISCOVERY_TIER: full
        run: node scripts/discover-concerts.mjs

      - name: Commit updated recommendations.json
        run: |
          git config user.name "listening-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/recommendations.json data/podiuminfo-cache.json
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: refresh full-tier recommendations"
          git push