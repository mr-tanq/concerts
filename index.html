<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />
  <meta name="theme-color" content="#08080a" />
  <title>Listening Mirror</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="masthead">
    <span class="masthead-name">Listening Mirror</span>

    <button
      class="masthead-settings"
      id="btn-settings"
      aria-label="Settings"
    >
      <span class="settings-dot" id="settings-dot"></span>
    </button>
  </header>

  <div id="settings-modal-root"></div>

  <main>
    <section id="panel-mirror" class="tab-panel"></section>
    <section id="panel-realm" class="tab-panel"></section>
    <section id="panel-concerts" class="tab-panel"></section>
    <section id="panel-identity" class="tab-panel"></section>
    <section id="panel-archive" class="tab-panel"></section>
  </main>

  <nav class="rail">
    <button id="nav-mirror">
      <span>Mirror</span>
    </button>

    <button id="nav-realm">
      <span>Realm</span>
    </button>

    <button id="nav-concerts">
      <span>Tonight</span>
    </button>

    <button id="nav-identity">
      <span>Self</span>
    </button>

    <button id="nav-archive">
      <span>Archive</span>
    </button>
  </nav>

  <script type="module" src="js/app.js"></script>

  <!-- =========================================================
       PHASE 2B
       Source provenance icon:
       Spotify / YouTube / Ambient radio
       ========================================================= -->
  <script type="module">
    import {
      getReadSecret
    } from "./js/relay-config.js";

    import {
      fetchRelayState,
      isFresh
    } from "./js/relay-client.js";

    const ICON_REFRESH_MS = 5000;

    let refreshInFlight = false;
    let scheduled = false;

    function norm(value) {
      return (value || "")
        .toLowerCase()
        .normalize("NFKD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, " ")
        .trim();
    }

    function iconFor(source) {
      if (
        source === "spotify_web" ||
        source === "spotify_android"
      ) {
        return {
          label: "Spotify",

          svg: `
            <svg
              width="15"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.55"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="9.2"></circle>

              <path
                d="M7.1 9.4c3.5-1 7.2-.7 9.9.8"
              ></path>

              <path
                d="M7.8 12.4c2.9-.7 5.9-.45 8.2.6"
              ></path>

              <path
                d="M8.5 15.1c2.2-.5 4.5-.3 6.4.4"
              ></path>
            </svg>
          `,
        };
      }

      if (
        source === "youtube_android" ||
        source === "youtube_music_android"
      ) {
        return {
          label:
            source === "youtube_music_android"
              ? "YouTube Music"
              : "YouTube",

          svg: `
            <svg
              width="16"
              height="15"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.55"
              aria-hidden="true"
            >
              <rect
                x="3.5"
                y="6.5"
                width="17"
                height="11"
                rx="3.2"
              ></rect>

              <path
                d="M10 9.5l5 3-5 3z"
                fill="currentColor"
                stroke="none"
              ></path>
            </svg>
          `,
        };
      }

      if (source === "ambient_audd") {
        return {
          label: "Ambient · radio",

          svg: `
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.55"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M7 6l10-3"></path>

              <rect
                x="4"
                y="7"
                width="16"
                height="12"
                rx="2.4"
              ></rect>

              <path
                d="M7.5 11h3.3M7.5 14h3.3M7.5 17h2.2"
              ></path>

              <circle
                cx="15.6"
                cy="13.1"
                r="2.35"
              ></circle>
            </svg>
          `,
        };
      }

      return null;
    }

    function renderSource(source) {
      const trackRow =
        document.querySelector(
          "#panel-mirror .mirror-track"
        );

      if (!trackRow) {
        return;
      }

      let host =
        trackRow.querySelector(
          ".mirror-source-indicator"
        );

      const icon = iconFor(source);

      if (!icon) {
        host?.remove();
        return;
      }

      if (!host) {
        host = document.createElement("span");

        host.className =
          "mirror-source-indicator";

        host.style.cssText =
          "display:inline-flex;" +
          "align-items:center;" +
          "vertical-align:-3px;" +
          "margin-right:8px;" +
          "color:var(--bone-faint);" +
          "opacity:.9";

        trackRow.prepend(host);
      }

      if (
        host.dataset.source === source
      ) {
        return;
      }

      host.dataset.source = source;
      host.title = icon.label;

      host.setAttribute(
        "aria-label",
        icon.label
      );

      host.innerHTML = icon.svg;
    }

    async function refreshSourceIcon() {
      if (
        refreshInFlight ||
        document.hidden
      ) {
        return;
      }

      const trackRow =
        document.querySelector(
          "#panel-mirror .mirror-track"
        );

      if (!trackRow) {
        return;
      }

      refreshInFlight = true;

      try {
        /*
         * Spotify Web is identifiable from
         * Mirror's own playback controls.
         */
        if (
          document.querySelector(
            "#panel-mirror .mirror-controls"
          )
        ) {
          renderSource("spotify_web");
          return;
        }

        const secret =
          getReadSecret();

        if (!secret) {
          renderSource(null);
          return;
        }

        const { payload } =
          await fetchRelayState(secret);

        if (
          !isFresh(payload) ||
          !payload.present ||
          !payload.state
        ) {
          renderSource(null);
          return;
        }

        const shownTrack =
          trackRow
            .querySelector(
              ".mirror-track-name"
            )
            ?.textContent || "";

        const shownArtist =
          (
            trackRow
              .querySelector(
                ".mirror-track-artist"
              )
              ?.textContent || ""
          ).replace(
            /^\s*—\s*/,
            ""
          );

        const relay =
          payload.state;

        /*
         * Only claim the source if the
         * relay song is the song that
         * Mirror is actually showing.
         */
        if (
          norm(shownTrack) ===
            norm(relay.track) &&
          norm(shownArtist) ===
            norm(relay.artist)
        ) {
          renderSource(
            relay.source
          );
        } else {
          renderSource(null);
        }
      } catch (_) {
        /*
         * Decorative only.
         * Source icon failure must never
         * break Mirror.
         */
      } finally {
        refreshInFlight = false;
      }
    }

    function scheduleRefresh() {
      if (scheduled) {
        return;
      }

      scheduled = true;

      queueMicrotask(() => {
        scheduled = false;
        refreshSourceIcon();
      });
    }

    new MutationObserver(
      scheduleRefresh
    ).observe(
      document.body,
      {
        childList: true,
        subtree: true,
      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          refreshSourceIcon();
        }
      }
    );

    setInterval(
      refreshSourceIcon,
      ICON_REFRESH_MS
    );

    refreshSourceIcon();
  </script>

  <!-- =========================================================
       PHASE 2C.1
       Ambient remote control

       IMPORTANT:
       No separate control credential anymore.

       Mirror uses its EXISTING relay read credential
       for status + ON/OFF commands.

       Android continues to use its write credential
       for command polling + acknowledgement.
       ========================================================= -->
  <script type="module">
    import {
      RELAY_URL,
      RELAY_ANON_KEY,
      getReadSecret,
    } from "./js/relay-config.js";

    const CONTROL_POLL_MS = 3000;

    let controlBusy = false;
    let controlLast = null;

    /*
     * Delete the obsolete Phase 2C
     * pairing secret if an older build
     * left one in this browser.
     *
     * It is no longer used at all.
     */
    try {
      localStorage.removeItem(
        "lm_ambient_control_secret"
      );
    } catch {}

    async function rpc(
      name,
      body
    ) {
      const res =
        await fetch(
          `${RELAY_URL}/rest/v1/rpc/${name}`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              apikey:
                RELAY_ANON_KEY,

              Authorization:
                `Bearer ${RELAY_ANON_KEY}`,
            },

            body:
              JSON.stringify(body),
          }
        );

      if (!res.ok) {
        throw new Error(
          `Ambient control HTTP ${res.status}`
        );
      }

      return res.json();
    }

    function controlSecret() {
      const secret =
        getReadSecret();

      if (!secret) {
        throw new Error(
          "Relay read secret is not configured."
        );
      }

      return secret;
    }

    function ensureControlButton() {
      const stage =
        document.querySelector(
          "#panel-mirror .mirror-stage"
        );

      if (!stage) {
        return;
      }

      if (
        stage.querySelector(
          "#mirror-ambient-control"
        )
      ) {
        return;
      }

      stage.style.position =
        "relative";

      const button =
        document.createElement(
          "button"
        );

      button.id =
        "mirror-ambient-control";

      button.type =
        "button";

      button.setAttribute(
        "aria-label",
        "Ambient recognition"
      );

      button.setAttribute(
        "aria-pressed",
        "false"
      );

      button.style.cssText =
        "position:absolute;" +
        "top:0;" +
        "right:0;" +
        "display:inline-flex;" +
        "align-items:center;" +
        "gap:7px;" +
        "padding:3px 0 7px 12px;" +
        "color:var(--bone-faint);" +
        "line-height:1;" +
        "border:0;" +
        "background:none;" +
        "cursor:pointer;";

      button.innerHTML = `
        <svg
          width="17"
          height="17"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.45"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path
            d="M7 6l10-3"
          ></path>

          <rect
            x="4"
            y="7"
            width="16"
            height="12"
            rx="2.4"
          ></rect>

          <path
            d="M7.5 11h3.3M7.5 14h3.3M7.5 17h2.2"
          ></path>

          <circle
            cx="15.6"
            cy="13.1"
            r="2.35"
          ></circle>
        </svg>

        <span
          class="ambient-control-dot"
          style="
            display:block;
            width:6px;
            height:6px;
            border-radius:50%;
            background:var(--bone-faint);
            transition:
              background .25s,
              box-shadow .25s,
              opacity .25s;
          "
        ></span>
      `;

      button.addEventListener(
        "click",
        toggleAmbientRemote
      );

      stage.appendChild(
        button
      );

      renderControl(
        controlLast
      );
    }

    function renderControl(
      state,
      error = null
    ) {
      ensureControlButton();

      const button =
        document.querySelector(
          "#mirror-ambient-control"
        );

      if (!button) {
        return;
      }

      const dot =
        button.querySelector(
          ".ambient-control-dot"
        );

      if (!dot) {
        return;
      }

      /*
       * Error state.
       */
      if (error) {
        dot.style.background =
          "#cf665e";

        dot.style.boxShadow =
          "none";

        button.title =
          error;

        return;
      }

      /*
       * No row yet means OFF.
       */
      if (
        !state ||
        !state.present
      ) {
        dot.style.background =
          "var(--bone-faint)";

        dot.style.boxShadow =
          "none";

        dot.style.opacity =
          ".55";

        button.title =
          "Ambient remote · OFF";

        button.setAttribute(
          "aria-pressed",
          "false"
        );

        return;
      }

      const desired =
        state.desired_enabled === true;

      const acked =
        state.ack_sequence ===
          state.command_sequence &&
        state.ack_enabled ===
          desired;

      /*
       * ON and acknowledged by Companion.
       */
      if (
        desired &&
        acked
      ) {
        dot.style.background =
          "#8bd7df";

        dot.style.boxShadow =
          "0 0 9px rgba(139,215,223,.65)";

        dot.style.opacity =
          "1";

        button.title =
          "Ambient remote · ON";

        button.setAttribute(
          "aria-pressed",
          "true"
        );

        return;
      }

      /*
       * ON command sent,
       * waiting for Android ACK.
       */
      if (desired) {
        dot.style.background =
          "#d59a67";

        dot.style.boxShadow =
          "0 0 8px rgba(213,154,103,.4)";

        dot.style.opacity =
          "1";

        button.title =
          "Ambient remote · ON requested";

        button.setAttribute(
          "aria-pressed",
          "true"
        );

        return;
      }

      /*
       * OFF and acknowledged.
       */
      if (acked) {
        dot.style.background =
          "var(--bone-faint)";

        dot.style.boxShadow =
          "none";

        dot.style.opacity =
          ".55";

        button.title =
          "Ambient remote · OFF";

        button.setAttribute(
          "aria-pressed",
          "false"
        );

        return;
      }

      /*
       * OFF command sent,
       * waiting for Companion ACK.
       */
      dot.style.background =
        "#d59a67";

      dot.style.boxShadow =
        "none";

      dot.style.opacity =
        ".8";

      button.title =
        "Ambient remote · OFF requested";

      button.setAttribute(
        "aria-pressed",
        "false"
      );
    }

    async function fetchControlStatus() {
      const secret =
        controlSecret();

      const result =
        await rpc(
          "read_ambient_control_status",
          {
            p_secret:
              secret,
          }
        );

      if (!result?.ok) {
        throw new Error(
          result?.reason ||
          "Ambient status rejected."
        );
      }

      return result;
    }

    async function readControlStatus() {
      if (document.hidden) {
        return;
      }

      try {
        const result =
          await fetchControlStatus();

        controlLast =
          result;

        renderControl(
          result
        );
      } catch (err) {
        renderControl(
          controlLast,
          err?.message ||
          "Ambient control unavailable."
        );
      }
    }

    async function toggleAmbientRemote() {
      if (controlBusy) {
        return;
      }

      controlBusy = true;

      const button =
        document.querySelector(
          "#mirror-ambient-control"
        );

      if (button) {
        button.style.opacity =
          ".5";
      }

      try {
        const secret =
          controlSecret();

        /*
         * Always ask Supabase first.
         *
         * This means:
         * first tap:
         *   false -> true
         *
         * second tap:
         *   true -> false
         *
         * No optimistic cached-state guessing.
         */
        const current =
          await fetchControlStatus();

        const currentlyEnabled =
          current.present === true &&
          current.desired_enabled === true;

        const nextEnabled =
          !currentlyEnabled;

        const result =
          await rpc(
            "set_ambient_control",
            {
              p_secret:
                secret,

              p_enabled:
                nextEnabled,
            }
          );

        if (!result?.ok) {
          throw new Error(
            result?.reason ||
            "Ambient command rejected."
          );
        }

        controlLast = {
          ...result,
          present: true,
        };

        renderControl(
          controlLast
        );

        /*
         * Android ACK is asynchronous.
         */
        setTimeout(
          readControlStatus,
          800
        );

        setTimeout(
          readControlStatus,
          1800
        );
      } catch (err) {
        renderControl(
          controlLast,
          err?.message ||
          "Ambient control failed."
        );
      } finally {
        controlBusy = false;

        if (button) {
          button.style.opacity =
            "1";
        }
      }
    }

    /*
     * Mirror redraws its own DOM,
     * therefore recreate the small
     * control if needed.
     */
    const controlObserver =
      new MutationObserver(() => {
        ensureControlButton();
      });

    controlObserver.observe(
      document.body,
      {
        childList: true,
        subtree: true,
      }
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (!document.hidden) {
          ensureControlButton();
          readControlStatus();
        }
      }
    );

    setInterval(
      readControlStatus,
      CONTROL_POLL_MS
    );

    ensureControlButton();
    readControlStatus();
  </script>
</body>
</html>
