<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0B0C10" />
  <title>Listening Mirror</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>Listening Mirror</h1>
      </div>
      <button class="header-gear" id="btn-settings" aria-label="Settings">⚙</button>
    </div>
  </header>

  <div id="settings-modal-root"></div>

  <main>
    <section id="panel-mirror" class="tab-panel">
      <h2 class="section-title">Mirror</h2>
      <p class="section-sub">Live listening analytics (heat / flux / focus / depth). Coming next — this tab keeps its existing Last.fm/Spotify "now playing" behaviour.</p>
    </section>

    <section id="panel-realm" class="tab-panel">
      <h2 class="section-title">Realm</h2>
      <p class="section-sub">Recommendations and discovery. Coming next.</p>
    </section>

    <section id="panel-concerts" class="tab-panel"></section>

    <section id="panel-identity" class="tab-panel">
      <h2 class="section-title">Identity</h2>
      <p class="section-sub">Recent and top listening containers. Coming next.</p>
    </section>

    <section id="panel-archive" class="tab-panel"></section>
  </main>

  <nav class="tab-bar">
    <button id="nav-mirror"><span class="nav-icon" aria-hidden="true">◐</span><span class="nav-label">Mirror</span></button>
    <button id="nav-realm"><span class="nav-icon" aria-hidden="true">✦</span><span class="nav-label">Realm</span></button>
    <button id="nav-concerts"><span class="nav-icon" aria-hidden="true">▤</span><span class="nav-label">Concerts</span></button>
    <button id="nav-identity"><span class="nav-icon" aria-hidden="true">◈</span><span class="nav-label">Identity</span></button>
    <button id="nav-archive"><span class="nav-icon" aria-hidden="true">▥</span><span class="nav-label">Archive</span></button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
