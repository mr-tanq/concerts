<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  />
  <meta name="theme-color" content="#08080a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Mirror" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <title>Listening Mirror</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css?v=premium-ticket-intelligence" />
  <link rel="stylesheet" href="css/self-life.css?v=self-20261003-1" />
</head>

<body>
  <header class="masthead">
    <h1 class="masthead-name">Live</h1>

    <button
      class="masthead-settings"
      id="btn-settings"
      type="button"
      aria-label="Settings"
      title="Settings"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path>
        <circle cx="16" cy="7" r="2"></circle>
        <circle cx="10" cy="17" r="2"></circle>
      </svg>
      <span class="settings-dot" id="settings-dot"></span>
    </button>
  </header>

  <div id="settings-modal-root"></div>

  <main>
    <section id="panel-mirror" class="tab-panel"></section>
    <section id="panel-realm" class="tab-panel"></section>
    <section id="panel-concerts" class="tab-panel"></section>
    <section id="panel-identity" class="tab-panel"></section>
    <section id="panel-archive" class="tab-panel"></section>
  </main>

  <nav class="rail" aria-label="Sections">
    <button id="nav-mirror" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M8.5 9.5a4.5 4.5 0 0 1 3.5-2"></path></svg>
      <span>Mirror</span>
    </button>

    <button id="nav-realm" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M4 12h16M12 4c2.5 2.3 3.6 5 3.6 8s-1.1 5.7-3.6 8c-2.5-2.3-3.6-5-3.6-8s1.1-5.7 3.6-8z"></path></svg>
      <span>Realm</span>
    </button>

    <button id="nav-concerts" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7.5h16v3a1.8 1.8 0 0 0 0 3v3H4v-3a1.8 1.8 0 0 0 0-3z"></path><path d="M14 7.5v9" stroke-dasharray="1.5 2"></path></svg>
      <span>Live</span>
    </button>

    <button id="nav-identity" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"></circle><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"></path></svg>
      <span>Self</span>
    </button>

    <button id="nav-archive" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="4" rx="1"></rect><path d="M5.5 9v10h13V9M10 13h4"></path></svg>
      <span>Archive</span>
    </button>
  </nav>

  <script type="module" src="js/app.js?v=premium-ticket-intelligence"></script>
  <!-- Mirror's source icon and ambient remote now live in
       js/mirror-source-icon.js and js/ambient-control.js, owned by mirror.js. -->

  <script>
    // Home-screen install + always-fresh code (see sw.js). Purely additive:
    // if registration fails the app works exactly as before.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>

</body>
</html>
